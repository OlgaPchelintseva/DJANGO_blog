{% extends 'post/base.html' %}
{% block title %} {{ page_title }} {% endblock %}

{% block content %}
    <h1>Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit" >Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? 
        <a href="{% url 'login' %}">Войти</a>
    </p>
{% endblock %}
